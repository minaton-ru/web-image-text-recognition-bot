[project]
name = "web-image-text-recognition-bot"
version = "0.2.0"
description = "Telegram bot for extracting text from an image from a website"
requires-python = "==3.13.5"
dependencies = [
"aiogram==3.27.0",
"beautifulsoup4==4.14.3",
"pytesseract==0.3.13",
"python-dotenv==1.2.3"
]

[dependency-groups]
dev = [
"ruff==0.16.8",
"pytest==9.0.3",
"pytest-asyncio==1.3.0",
"pytest-cov==7.0.0",
"httpx==0.28.1",
]

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
